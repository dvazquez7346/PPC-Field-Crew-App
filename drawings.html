<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PPC Inc. — Drawing Markup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1B2A41">
<style>
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --surface-2:#F5F7F8;
  --navy:#1B2A41; --navy-2:#243A56; --orange:#E8622C; --orange-dark:#C94E1D;
  --blueprint:#2F5D8A; --ink:#16202C; --muted:#6B7686; --line:#DDE1E6;
  --success:#2E8B57; --success-bg:#E6F3EC; --warn:#B8860B; --warn-bg:#FBF2DF;
  --danger:#C0392B; --danger-bg:#FBEAE7; --radius:14px;
  --shadow:0 1px 2px rgba(20,30,50,0.06), 0 4px 14px rgba(20,30,50,0.06);
  --toolrail-w:64px; --panel-w:300px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;height:100%;overflow:hidden;}
h1,h2,h3,.disp{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:0.01em;}
button{font-family:inherit;cursor:pointer;}
input,textarea{font-family:inherit;}

.app{display:flex;flex-direction:column;height:100vh;}

/* ---- Top bar ---- */
.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;flex-shrink:0;box-shadow:var(--shadow);z-index:20;flex-wrap:wrap;}
.topbar .brand{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;letter-spacing:0.02em;white-space:nowrap;}
.topbar .brand .sub{color:#9FB0C8;font-weight:500;font-size:12px;display:block;letter-spacing:0.06em;text-transform:uppercase;}
.job-select{display:flex;align-items:center;gap:8px;margin-left:8px;position:relative;flex-wrap:wrap;}
.job-select input{background:#243A56;border:1px solid #35496A;color:#fff;border-radius:8px;padding:7px 10px;font-size:13px;width:130px;}
.job-select input::placeholder{color:#7E93B0;}
.job-select button{background:var(--orange);border:none;color:#fff;font-weight:600;font-size:13px;padding:7px 14px;border-radius:8px;}
.job-select button:hover{background:var(--orange-dark);}
.job-browse-btn{background:transparent;border:1px solid #35496A;color:#CBD8EA;font-weight:600;font-size:13px;padding:7px 12px;border-radius:8px;}
.job-browse-btn:hover{background:#243A56;}
.job-name-chip{color:#fff;font-weight:600;font-size:13px;background:#243A56;border:1px solid #35496A;border-radius:8px;padding:6px 10px;cursor:pointer;}
.job-dropdown{position:absolute;top:calc(100% + 8px);left:0;width:280px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:80;max-height:320px;overflow-y:auto;}
.job-dropdown-head{padding:10px 14px 8px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid var(--line);}
.job-row{padding:10px 14px;font-size:13px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.job-row:hover{background:var(--surface-2);}
.job-row .jr-id{font-weight:600;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--blueprint);}
.job-row .jr-name{font-weight:500;flex:1;margin-left:8px;}
.job-row .jr-time{font-size:11px;color:var(--muted);white-space:nowrap;}
.job-dropdown-empty,.job-dropdown-loading{padding:16px 14px;font-size:12.5px;color:var(--muted);text-align:center;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;}
.nav-link{color:#CBD8EA;text-decoration:none;font-weight:600;font-size:13px;border:1px solid #35496A;padding:6px 12px;border-radius:8px;}
.nav-link:hover{background:#243A56;}
.account-chip{color:#CBD8EA;font-size:12px;}

/* ---- Sheet tabs ---- */
.sheet-tabs{display:flex;align-items:center;gap:4px;background:var(--navy-2);padding:0 12px;overflow-x:auto;flex-shrink:0;}
.sheet-tab{padding:9px 10px 9px 16px;font-size:12.5px;font-weight:600;color:#B9C7DC;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:6px;}
.sheet-tab.active{color:#fff;border-bottom-color:var(--orange);}
.sheet-tab .rename-ic{opacity:0.6;font-size:11px;padding:2px;}
.sheet-tab .rename-ic:hover{opacity:1;}
.sheet-tab-add{padding:9px 12px;font-size:16px;color:#9FB0C8;cursor:pointer;}
.sheet-tab-add:hover{color:#fff;}

/* ---- Main layout ---- */
.main{flex:1;display:flex;overflow:hidden;position:relative;}
.canvas-area{flex:1;position:relative;background:#C9CED6;overflow:auto;display:flex;align-items:flex-start;justify-content:center;}
.canvas-area.panning{cursor:grabbing;}
.zoom-wrapper{position:relative;margin:24px;}
.canvas-stack{position:absolute;top:0;left:0;box-shadow:var(--shadow);background:#fff;transform-origin:top left;}
.zoom-controls{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:45;}
.zoom-controls button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--navy);font-size:17px;font-weight:700;box-shadow:var(--shadow);}
.zoom-controls button:hover{background:var(--surface-2);}
#zoomFitBtn{font-size:14px;}
.run-done-btn{position:absolute;top:16px;right:16px;background:var(--success);color:#fff;border:none;font-weight:600;font-size:13px;padding:9px 16px;border-radius:9px;box-shadow:var(--shadow);z-index:45;}
.run-done-btn:hover{background:#256e46;}
.markup-action-group{position:absolute;display:flex;gap:6px;z-index:30;}
.markup-action-group button{background:var(--navy);color:#fff;font-size:11px;font-weight:600;padding:5px 10px;border-radius:7px;border:none;box-shadow:var(--shadow);white-space:nowrap;}
.markup-action-group button:hover{background:var(--navy-2);}
.markup-action-group button.delete-btn{background:var(--danger);}
.markup-action-group button.delete-btn:hover{background:#9C2E20;}
.canvas-stack canvas{display:block;}
#pdfCanvas{position:relative;}
#markupCanvas{position:absolute;top:0;left:0;touch-action:none;}

.empty-state{margin:auto;text-align:center;color:var(--muted);max-width:340px;}
.empty-state .disp{font-size:22px;color:var(--navy);margin-bottom:6px;}
.empty-state button{margin-top:14px;background:var(--orange);border:none;color:#fff;font-weight:600;font-size:13.5px;padding:10px 18px;border-radius:9px;}
.empty-state button:hover{background:var(--orange-dark);}

/* ---- Toolbar (left rail, desktop/tablet) ---- */
.toolrail{width:var(--toolrail-w);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;flex-shrink:0;overflow-y:auto;}
.tool-btn{width:44px;height:44px;border-radius:10px;border:1px solid transparent;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:18px;}
.tool-btn:hover{background:var(--surface-2);}
.tool-btn.active{background:var(--navy);color:#fff;}
.tool-sep{width:32px;height:1px;background:var(--line);margin:6px 0;}
.tool-label{font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;margin-top:-2px;text-align:center;}
.color-row,.thickness-row,.shape-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:0 6px;}
.color-dot{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;}
.color-dot.active{box-shadow:0 0 0 2px var(--navy);}
.thickness-dot{width:32px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;}
.thickness-dot.active{border-color:var(--navy);background:var(--surface-2);}
.thickness-dot span{display:block;background:var(--navy);border-radius:2px;}
.shape-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--navy);font-size:14px;}
.shape-btn.active{border-color:var(--navy);background:var(--surface-2);}

/* ---- Right panel: notes list ---- */
.panel{width:var(--panel-w);background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;}
.panel-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.panel-head .disp{font-size:15px;color:var(--navy);}
.panel-head .count{font-size:11px;color:var(--muted);}
.panel-close{display:none;background:none;border:none;color:var(--muted);font-size:18px;}
.panel-list{flex:1;overflow-y:auto;padding:8px;}
.note-card{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;cursor:pointer;}
.note-card.selected{border-color:var(--orange);}
.note-card:hover{border-color:var(--blueprint);}
.note-card .nc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.note-card .nc-type{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:var(--blueprint);text-transform:uppercase;}
.note-card .nc-time{font-size:10px;color:var(--muted);}
.note-card .nc-text{color:var(--ink);line-height:1.4;}
.note-card .nc-empty{color:var(--muted);font-style:italic;}
.panel-empty{padding:24px 16px;color:var(--muted);font-size:12.5px;text-align:center;}

/* ---- Bottom bar: save state ---- */
.bottombar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--surface);border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex-shrink:0;}
.save-btn{margin-left:auto;background:var(--navy);color:#fff;border:none;font-weight:600;font-size:13px;padding:8px 16px;border-radius:8px;}
.save-btn:hover{background:var(--navy-2);}
.save-btn:disabled{opacity:.5;cursor:default;}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--success);flex-shrink:0;}
.status-dot.dirty{background:var(--warn);}
.mobile-panel-toggle{display:none;background:var(--navy);color:#fff;border:none;font-weight:600;font-size:12px;padding:7px 12px;border-radius:7px;}

/* ---- Selection handles + floating edit button on canvas ---- */

/* ---- Modal (replaces native prompt/confirm everywhere) ---- */
.modal-backdrop{position:fixed;inset:0;background:rgba(20,30,50,0.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);width:100%;max-width:360px;padding:18px;}
.modal-card .disp{font-size:16px;color:var(--navy);margin-bottom:4px;}
.modal-card .modal-sub{font-size:12.5px;color:var(--muted);margin-bottom:12px;}
.modal-card textarea,.modal-card input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;resize:vertical;min-height:38px;}
.modal-card textarea{min-height:70px;}
.symbol-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.symbol-btn{width:32px;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);font-size:15px;color:var(--navy);}
.symbol-btn:hover{border-color:var(--blueprint);}
.modal-row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
.modal-row button{font-size:13px;font-weight:600;padding:8px 16px;border-radius:8px;border:none;}
.modal-row .save{background:var(--orange);color:#fff;}
.modal-row .save:hover{background:var(--orange-dark);}
.modal-row .cancel{background:var(--surface-2);color:var(--muted);}
.modal-row .destructive{background:var(--danger-bg);color:var(--danger);margin-right:auto;}

/* ---- Sign-in overlay ---- */
.gate{position:fixed;inset:0;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:1000;padding:20px;text-align:center;}
.gate .disp{font-size:22px;}
.gate button{background:var(--orange);border:none;color:#fff;font-weight:600;font-size:14px;padding:11px 22px;border-radius:9px;}
.gate button:hover{background:var(--orange-dark);}
.gate .err{color:#FFB4A6;font-size:13px;max-width:320px;text-align:center;}
.hidden{display:none !important;}

/* ============================================================
   RESPONSIVE: tablet / phone
   ============================================================ */
@media (max-width: 900px){
  .toolrail{
    position:fixed; bottom:0; left:0; right:0; width:auto; height:auto;
    flex-direction:row; flex-wrap:wrap; border-right:none; border-top:1px solid var(--line);
    padding:8px; gap:4px; z-index:40; justify-content:center; max-height:40vh;
  }
  .tool-label{display:none;}
  .tool-sep{width:1px;height:32px;margin:0 4px;}
  .main{padding-bottom:64px;} /* space for fixed bottom rail */
  .panel{
    position:fixed; right:0; bottom:64px; top:auto; height:45vh; width:100%;
    max-width:420px; border-left:none; border-top:1px solid var(--line);
    box-shadow:0 -4px 14px rgba(20,30,50,0.12); z-index:35; transform:translateX(0);
  }
  .panel.panel-hidden{display:none;}
  .panel-close{display:block;}
  .mobile-panel-toggle{display:inline-block;}
  .job-select input{width:100px;}
  .job-select{gap:6px;}
  .topbar{padding:8px 10px;gap:6px;}
  .topbar .brand .sub{display:none;}
  .nav-link{padding:6px 9px;font-size:12px;}
}
@media (max-width: 520px){
  .tool-btn{width:38px;height:38px;font-size:16px;}
  .color-dot{width:18px;height:18px;}
  .job-select input{width:84px;font-size:12px;}
  .job-browse-btn{font-size:12px;padding:6px 9px;}
  .account-chip{display:none;}
}
</style>
</head>
<body>

<div id="gate" class="gate">
  <div class="disp">PPC Inc. — Drawing Markup</div>
  <button id="signInBtn">Sign in with Microsoft</button>
  <div id="gateErr" class="err hidden"></div>
</div>

<div class="app hidden" id="app">
  <div class="topbar">
    <div class="brand">Drawing Markup<span class="sub">PPC Field Tools</span></div>
    <div class="job-select">
      <input id="jobIdInput" placeholder="Job number">
      <button id="loadJobBtn">Open</button>
      <button class="job-browse-btn" id="browseJobsBtn">Browse ▾</button>
      <span class="job-name-chip hidden" id="jobNameChip"></span>
      <div class="job-dropdown hidden" id="jobDropdown"></div>
    </div>
    <div class="topbar-right">
      <button class="mobile-panel-toggle" id="mobilePanelToggle">Notes</button>
      <a class="nav-link" href="index.html">← Crew Directory</a>
      <span class="account-chip" id="accountChip"></span>
    </div>
  </div>

  <div class="sheet-tabs" id="sheetTabs"></div>

  <div class="main">
    <div class="toolrail" id="toolrail">
      <button class="tool-btn active" data-tool="pan" title="Pan">✋</button>
      <div class="tool-label">Pan</div>
      <button class="tool-btn" data-tool="draw" title="Freehand draw">✏️</button>
      <div class="tool-label">Draw</div>
      <button class="tool-btn" data-tool="line" title="Straight line, snapped to 15°">📏</button>
      <div class="tool-label">Line</div>
      <button class="tool-btn" data-tool="multiline" title="Multi-segment run, snapped, rounded joints">〜</button>
      <div class="tool-label">Run</div>
      <button class="tool-btn" data-tool="shape" title="Shapes">⬡</button>
      <div class="tool-label">Shape</div>
      <button class="tool-btn" data-tool="dimension" title="Dimension line with arrowheads and text">↔️</button>
      <div class="tool-label">Dim</div>
      <button class="tool-btn" data-tool="hatchline" title="Hatched line (cross-out a run)">╳</button>
      <div class="tool-label">Hatch</div>
      <button class="tool-btn" data-tool="hatcharea" title="Freeform hatched area (demo'd zone)">▦</button>
      <div class="tool-label">Area</div>
      <button class="tool-btn" data-tool="label" title="Label with leader (dot tip)">🏷️</button>
      <div class="tool-label">Label</div>
      <button class="tool-btn" data-tool="select" title="Select / move / edit / delete a markup">👆</button>
      <div class="tool-label">Select</div>
      <button class="tool-btn" data-tool="note" title="Note with leader (arrow tip)">📌</button>
      <div class="tool-label">Note</div>
      <button class="tool-btn" data-tool="erase" title="Erase a markup">🧹</button>
      <div class="tool-label">Erase</div>
      <div class="tool-sep"></div>
      <div class="color-row">
        <div class="color-dot active" data-color="#E8622C" style="background:#E8622C"></div>
        <div class="color-dot" data-color="#2F5D8A" style="background:#2F5D8A"></div>
        <div class="color-dot" data-color="#2E8B57" style="background:#2E8B57"></div>
        <div class="color-dot" data-color="#C0392B" style="background:#C0392B"></div>
      </div>
      <div class="tool-sep"></div>
      <div class="thickness-row">
        <div class="thickness-dot active" data-thickness="2"><span style="width:14px;height:2px;"></span></div>
        <div class="thickness-dot" data-thickness="4"><span style="width:14px;height:4px;"></span></div>
        <div class="thickness-dot" data-thickness="7"><span style="width:14px;height:7px;"></span></div>
      </div>
      <div class="tool-sep hidden" id="shapeRowSep"></div>
      <div class="shape-row hidden" id="shapeRow">
        <button class="shape-btn active" data-shape="circle" title="Circle">●</button>
        <button class="shape-btn" data-shape="triangle" title="Triangle">▲</button>
        <button class="shape-btn" data-shape="diamond" title="Diamond">◆</button>
        <button class="shape-btn" data-shape="hexagon" title="Hexagon">⬡</button>
      </div>
    </div>

    <div class="canvas-area" id="canvasArea">
      <div class="empty-state" id="emptyState">
        <div class="disp" id="emptyStateTitle">No job open</div>
        <p id="emptyStateBody">Type a job number above and click Open, or click "Browse" to pick from existing jobs.</p>
        <input type="file" id="pdfUpload" accept="application/pdf" class="hidden">
        <button id="uploadBtn" class="hidden">Upload floor plan PDF</button>
      </div>
      <div class="zoom-wrapper hidden" id="zoomWrapper">
        <div class="canvas-stack" id="canvasStack">
          <canvas id="pdfCanvas"></canvas>
          <canvas id="markupCanvas"></canvas>
        </div>
      </div>
      <div class="zoom-controls hidden" id="zoomControls">
        <button id="zoomInBtn" title="Zoom in">+</button>
        <button id="zoomFitBtn" title="Fit to screen">⤢</button>
        <button id="zoomOutBtn" title="Zoom out">−</button>
      </div>
      <button class="run-done-btn hidden" id="runDoneBtn">Done ✓</button>
    </div>

    <div class="panel panel-hidden" id="panel">
      <div class="panel-head">
        <div>
          <div class="disp">Notes on this sheet</div>
          <div class="count" id="noteCount">0 markups</div>
        </div>
        <button class="panel-close" id="panelCloseBtn">✕</button>
      </div>
      <div class="panel-list" id="noteList">
        <div class="panel-empty">No markups yet.</div>
      </div>
    </div>
  </div>

  <div class="bottombar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">No job open</span>
    <button class="save-btn" id="saveBtn" disabled>Save</button>
  </div>
</div>

<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2/lib/msal-browser.min.js"></script>
<script src="shared-app-core.js?v=3"></script>

<script>
if(typeof pdfjsLib !== 'undefined'){
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
} else {
  console.error('pdf.js failed to load from CDN — PDF viewing will be unavailable, but sign-in and the rest of the app will still work.');
}

/* ============================================================
   STATE
   ============================================================
   Job file "job-<id>-markup.json":
   { jobId, jobName, sheets: [ { id, name, pdfPath, markups: [...] } ] }

   Lightweight "jobs-index.json": { jobs: [ {jobId, jobName, lastModified} ] }
   Kept small on purpose so the Browse dropdown never has to open every job
   file just to show a name — it stays fast no matter how many jobs exist.

   Markup shapes:
     freehand   { id, type:'freehand', color, thickness, points:[{x,y}], note }
     line       { id, type:'line', color, thickness, p0, p1, note }
     multiline  { id, type:'multiline', color, thickness, points:[{x,y}], note }
     shape      { id, type:'shape', shape:'circle'|'rect'|'triangle'|'diamond'|'hexagon'|'oval',
                  color, thickness, p0, p1, note }
     label      { id, type:'label', color, text, anchor, bend, textPos, note }  -- dot tip
     note       { id, type:'note',  color, text, anchor, bend, textPos, note }  -- arrow tip
*/
const state = {
  jobId: null, jobName: '', fileName: null,
  data: { jobId: null, jobName: '', sheets: [] },
  lastModified: null,
  activeSheetIndex: 0,
  pdfDoc: null, pageViewport: null,
  tool: 'pan', color: '#E8622C', thickness: 2, shapeType: 'circle',
  dirty: false,
  drawing: false, currentStroke: null,
  multiPoints: null,
  panState: null,
  selectedMarkupId: null, dragHandle: null,
  jobsIndexCache: null,
  zoom: 1, naturalWidth: 0, naturalHeight: 0,
  activePointers: new Map(), pinchState: null,
};

const ANGLE_STEP = 15; // degrees — snap increment for Line/Run tools
const AXIS_SNAP_THRESHOLD = 6; // degrees — Dimension tool snaps only near horizontal/vertical, else free angle
const JOINT_RADIUS = 10; // fixed fillet radius for multi-segment corners (diagrammatic, not exact)
const ANNOTATION_COLOR = '#2F5D8A'; // blueprint — shared default for Label, Note, Dimension

/* ============================================================
   MODAL SYSTEM — replaces every native prompt()/confirm() in the app
   ============================================================ */
function showModal({ title, sub, value = '', placeholder = '', withSymbols = false, confirmLabel = 'Save', destructiveLabel = null, onConfirm, onDestructive }){
  const root = $('#modalRoot');
  root.innerHTML = '';
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  const card = document.createElement('div');
  card.className = 'modal-card';
  card.innerHTML = `
    <div class="disp">${escapeHtml(title)}</div>
    ${sub ? `<div class="modal-sub">${escapeHtml(sub)}</div>` : ''}
    <textarea id="modalInput" placeholder="${escapeHtml(placeholder)}">${escapeHtml(value)}</textarea>
    ${withSymbols ? `<div class="symbol-row">${SYMBOLS.map(s => `<button type="button" class="symbol-btn" data-sym="${s}">${s}</button>`).join('')}</div>` : ''}
    <div class="modal-row">
      ${destructiveLabel ? `<button type="button" class="destructive">${escapeHtml(destructiveLabel)}</button>` : ''}
      <button type="button" class="cancel">Cancel</button>
      <button type="button" class="save">${escapeHtml(confirmLabel)}</button>
    </div>`;
  backdrop.appendChild(card);
  root.appendChild(backdrop);
  const input = card.querySelector('#modalInput');
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);

  card.querySelectorAll('.symbol-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const start = input.selectionStart, end = input.selectionEnd;
      input.value = input.value.slice(0, start) + btn.dataset.sym + input.value.slice(end);
      input.focus();
      input.setSelectionRange(start + btn.dataset.sym.length, start + btn.dataset.sym.length);
    });
  });
  function close(){ root.innerHTML = ''; }
  card.querySelector('.cancel').addEventListener('click', close);
  backdrop.addEventListener('click', (e) => { if(e.target === backdrop) close(); });
  card.querySelector('.save').addEventListener('click', () => {
    const val = input.value.trim();
    close();
    if(onConfirm) onConfirm(val);
  });
  if(destructiveLabel){
    card.querySelector('.destructive').addEventListener('click', () => {
      close();
      if(onDestructive) onDestructive();
    });
  }
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

/* ============================================================
   JOBS INDEX (lightweight — for the Browse dropdown)
   ============================================================ */
const INDEX_FILE = 'jobs-index.json';

async function loadJobsIndex(){
  try{
    const { data, lastModified } = await AppCore.readJsonFile(INDEX_FILE, { jobs: [] });
    state.jobsIndexCache = { data, lastModified };
    return data;
  }catch(e){
    console.error('Could not load jobs index', e);
    return null;
  }
}

async function upsertJobsIndex(jobId, jobName){
  try{
    let cache = state.jobsIndexCache;
    if(!cache){
      const loaded = await loadJobsIndex();
      cache = state.jobsIndexCache || { data: loaded || { jobs: [] }, lastModified: null };
    }
    const data = cache.data || { jobs: [] };
    const idx = data.jobs.findIndex(j => j.jobId === jobId);
    const entry = { jobId, jobName: jobName || '', lastModified: new Date().toISOString() };
    if(idx > -1) data.jobs[idx] = entry; else data.jobs.push(entry);
    const result = await AppCore.writeJsonFile(INDEX_FILE, data, cache.lastModified);
    state.jobsIndexCache = { data, lastModified: result.lastModified };
  }catch(e){
    // Index is a convenience for browsing, not the source of truth — a failed
    // update here shouldn't block the user's actual job save.
    console.error('Could not update jobs index', e);
  }
}

  $('#jobDropdown').classList.remove('hidden');
  renderJobDropdown(null);
  refreshJobDropdown();

function closeJobDropdown(){ $('#jobDropdown').classList.add('hidden'); }

async function refreshJobDropdown(){
  const indexData = await loadJobsIndex();
  let jobs = (indexData && indexData.jobs) ? indexData.jobs.slice() : null;
  if(jobs === null){
    // Self-heal: if the index is missing/unreadable, fall back to scanning filenames once.
    try{
      const files = await AppCore.listFilesMatching(/^job-(.+)-markup\.json$/);
      jobs = files.map(f => {
        const m = f.name.match(/^job-(.+)-markup\.json$/);
        return { jobId: m[1], jobName: '', lastModified: f.lastModifiedDateTime };
      });
    }catch(e){
      renderJobDropdown(null, 'Could not load job list.');
      return;
    }
  }
  jobs.sort((a, b) => new Date(b.lastModified) - new Date(a.lastModified));
  renderJobDropdown(jobs);
}

function renderJobDropdown(jobs, errorMsg){
  const dd = $('#jobDropdown');
  if(errorMsg){ dd.innerHTML = `<div class="job-dropdown-empty">${escapeHtml(errorMsg)}</div>`; return; }
  if(jobs === null){ dd.innerHTML = `<div class="job-dropdown-loading">Loading jobs…</div>`; return; }
  if(jobs.length === 0){ dd.innerHTML = `<div class="job-dropdown-empty">No jobs yet. Type a job number above to create the first one.</div>`; return; }
  const rows = jobs.map(j => {
    const time = j.lastModified ? new Date(j.lastModified).toLocaleDateString([], { month: 'short', day: 'numeric' }) : '';
    return `<div class="job-row" data-job-id="${escapeHtml(j.jobId)}">
      <span class="jr-id">#${escapeHtml(j.jobId)}</span>
      <span class="jr-name">${escapeHtml(j.jobName || '(no name)')}</span>
      <span class="jr-time">${time}</span>
    </div>`;
  }).join('');
  dd.innerHTML = `<div class="job-dropdown-head">${jobs.length} job${jobs.length === 1 ? '' : 's'} on file</div>${rows}`;
  dd.querySelectorAll('.job-row').forEach(row => row.addEventListener('click', () => openJobById(row.dataset.jobId)));
}

async function openJobById(jobId){
  if(!jobId) return;
  closeJobDropdown();
  $('#jobIdInput').value = jobId;
  setStatus('loading', 'Loading job ' + jobId + '…');
  const fileName = `job-${jobId}-markup.json`;
  try{
    const { data, lastModified } = await AppCore.readJsonFile(fileName, { jobId, jobName: '', sheets: [] });
    state.jobId = jobId;
    state.fileName = fileName;
    state.data = data;
    state.jobName = data.jobName || '';
    state.lastModified = lastModified;
    state.activeSheetIndex = 0;
    state.selectedMarkupId = null;
    state.dirty = false;
    if(!state.data.sheets || state.data.sheets.length === 0){
      state.data.sheets = [{ id: genId(), name: 'Sheet 1', pdfPath: null, markups: [] }];
    }
    updateJobNameChip();
    renderSheetTabs();
    await renderActiveSheet();
    setStatus('saved', 'Job ' + jobId + ' — all changes saved');
    refreshJobDropdown();
    if(!state.jobName){
      showModal({
        title: 'Name this job', sub: 'Helps you find it later in the Browse list.',
        placeholder: 'e.g. "Main St Renovation"', confirmLabel: 'Save',
        onConfirm: async (name) => {
          if(!name) return;
          state.jobName = name;
          state.data.jobName = name;
          markDirty();
          updateJobNameChip();
          await upsertJobsIndex(state.jobId, name);
        }
      });
    } else {
      await upsertJobsIndex(state.jobId, state.jobName);
    }
  }catch(e){
    console.error(e);
    setStatus('dirty', 'Could not load job: ' + (e.message || 'unknown error'));
  }
}

      renderSheetTabs();
      await renderActiveSheet();
    });
    tab.querySelector('.rename-ic').addEventListener('click', (e) => {
      e.stopPropagation();
      showModal({
        title: 'Rename sheet', value: sheet.name, placeholder: 'e.g. "Level 2 Floor Plan"', confirmLabel: 'Save',
        onConfirm: (name) => {
          if(!name) return;
          sheet.name = name;
          markDirty();
          renderSheetTabs();
        }
      });
    });
    wrap.appendChild(tab);
  });
  const addBtn = document.createElement('div');
  addBtn.className = 'sheet-tab-add';
  addBtn.textContent = '+';
  addBtn.title = 'Add sheet';
  addBtn.addEventListener('click', () => {
    if(!state.jobId){ showModal({ title: 'Open a job first', sub: 'You need an open job before adding sheets.', confirmLabel: 'OK', onConfirm: () => {} }); return; }
    showModal({
      title: 'New sheet', value: 'Sheet ' + (state.data.sheets.length + 1), placeholder: 'e.g. "Level 2 Floor Plan"', confirmLabel: 'Add',
      onConfirm: (name) => {
        if(!name) return;
        state.data.sheets.push({ id: genId(), name, pdfPath: null, markups: [] });
        state.activeSheetIndex = state.data.sheets.length - 1;
        state.selectedMarkupId = null;
        markDirty();
        renderSheetTabs();
        renderActiveSheet();
      }
    });
  });
  wrap.appendChild(addBtn);
}

  $('#emptyState').classList.add('hidden');
  $('#zoomWrapper').classList.remove('hidden');
  $('#zoomControls').classList.remove('hidden');

  try{
    const token = await AppCore.getGraphToken();
    const resolvedSiteId = await resolveSiteIdLocal(token);
    const contentRes = await fetch(
      `https://graph.microsoft.com/v1.0/sites/${resolvedSiteId}/drive/root:/${encodeURIComponent(sheet.pdfPath)}:/content`,
      { headers: { Authorization: `Bearer ${token}` } }
    );
    const buf = await contentRes.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({ scale: 1.5 });
    state.pageViewport = viewport;
    state.naturalWidth = viewport.width;
    state.naturalHeight = viewport.height;

    const canvas = pdfCanvasEl();
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;

    const mCanvas = markupCanvasEl();
    mCanvas.width = viewport.width;
    mCanvas.height = viewport.height;
    mCanvas.style.width = viewport.width + 'px';
    mCanvas.style.height = viewport.height + 'px';
    canvas.style.width = viewport.width + 'px';
    canvas.style.height = viewport.height + 'px';

    fitToScreen();
    drawAllMarkups();
    renderNoteList();
  }catch(e){
    console.error('PDF render failed', e);
    $('#emptyState').classList.remove('hidden');
    $('#zoomWrapper').classList.add('hidden');
    $('#zoomControls').classList.add('hidden');
  }
}

/* ============================================================
   ZOOM (in-app, independent of browser zoom)
   ============================================================
   The PDF/markup canvases always render at their natural pixel resolution;
   zoom is a CSS transform on top, so drawing/selection coordinates (which are
   computed from the element's on-screen bounding box) stay correct at any
   zoom level without extra math.
*/
const ZOOM_MIN = 0.3, ZOOM_MAX = 4, ZOOM_STEP = 0.2;

function applyZoom(){
  const wrapper = $('#zoomWrapper');
  const stack = $('#canvasStack');
  wrapper.style.width = (state.naturalWidth * state.zoom) + 'px';
  wrapper.style.height = (state.naturalHeight * state.zoom) + 'px';
  stack.style.transform = `scale(${state.zoom})`;
  if(state.selectedMarkupId) showMarkupActionButtons(state.selectedMarkupId);
}
function setZoom(z, focalClientX, focalClientY){
  const area = $('#canvasArea');
  const rect = area.getBoundingClientRect();
  const beforeScrollX = area.scrollLeft, beforeScrollY = area.scrollTop;
  const fx = (focalClientX != null) ? focalClientX - rect.left + beforeScrollX : area.clientWidth / 2 + beforeScrollX;
  const fy = (focalClientY != null) ? focalClientY - rect.top + beforeScrollY : area.clientHeight / 2 + beforeScrollY;
  const ratio = fx / (state.naturalWidth * state.zoom || 1);
  const ratioY = fy / (state.naturalHeight * state.zoom || 1);
  state.zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z));
  applyZoom();
  area.scrollLeft = ratio * (state.naturalWidth * state.zoom) - (focalClientX != null ? focalClientX - rect.left : area.clientWidth / 2);
  area.scrollTop = ratioY * (state.naturalHeight * state.zoom) - (focalClientY != null ? focalClientY - rect.top : area.clientHeight / 2);
}
function fitToScreen(){
  const area = $('#canvasArea');
  if(!state.naturalWidth || !state.naturalHeight) return;
  const availW = area.clientWidth - 48, availH = area.clientHeight - 48;
  const z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.min(availW / state.naturalWidth, availH / state.naturalHeight)));
  state.zoom = z;
  applyZoom();
  area.scrollLeft = 0;
  area.scrollTop = 0;
}
$('#zoomInBtn').addEventListener('click', () => setZoom(state.zoom + ZOOM_STEP));
$('#zoomOutBtn').addEventListener('click', () => setZoom(state.zoom - ZOOM_STEP));
$('#zoomFitBtn').addEventListener('click', fitToScreen);

/* ---- Pinch-to-zoom + two-finger pan (works in any tool) ---- */
$('#canvasArea').addEventListener('pointerdown', (e) => {
  if(!state.naturalWidth) return;
  state.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if(state.activePointers.size === 2){
    const pts = Array.from(state.activePointers.values());
    state.pinchState = {
      startDist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y),
      startZoom: state.zoom,
      startMid: { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 },
      startScroll: { left: $('#canvasArea').scrollLeft, top: $('#canvasArea').scrollTop },
    };
    // A second finger just landed — cancel any single-pointer draw/select in progress.
    state.drawing = false; state.currentStroke = null; state.dragHandle = null; state.panState = null;
  }
});
$('#canvasArea').addEventListener('pointermove', (e) => {
  if(!state.activePointers.has(e.pointerId)) return;
  state.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if(state.activePointers.size === 2 && state.pinchState){
    const pts = Array.from(state.activePointers.values());
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
    const newZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, state.pinchState.startZoom * (dist / (state.pinchState.startDist || 1))));
    state.zoom = newZoom;
    applyZoom();
    const area = $('#canvasArea');
    area.scrollLeft = state.pinchState.startScroll.left - (mid.x - state.pinchState.startMid.x);
    area.scrollTop = state.pinchState.startScroll.top - (mid.y - state.pinchState.startMid.y);
  }
});
function releasePointer(e){
  state.activePointers.delete(e.pointerId);
  if(state.activePointers.size < 2) state.pinchState = null;
}
$('#canvasArea').addEventListener('pointerup', releasePointer);
$('#canvasArea').addEventListener('pointercancel', releasePointer);
function twoFingersActive(){ return state.activePointers.size >= 2; }

/* ============================================================
   POINTER HANDLING
   ============================================================ */
const mCanvas = markupCanvasEl();
mCanvas.addEventListener('pointerdown', onPointerDown);
mCanvas.addEventListener('pointermove', onPointerMove);
mCanvas.addEventListener('pointerup', onPointerUp);
mCanvas.addEventListener('dblclick', onDblClick);

function canvasPoint(e){
  const rect = mCanvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (mCanvas.width / rect.width),
    y: (e.clientY - rect.top) * (mCanvas.height / rect.height),
  };
}

function angleSnap(from, to){
  const dx = to.x - from.x, dy = to.y - from.y;
  const dist = Math.hypot(dx, dy);
  if(dist < 1) return to;
  let angle = Math.atan2(dy, dx) * (180 / Math.PI);
  angle = Math.round(angle / ANGLE_STEP) * ANGLE_STEP;
  const rad = angle * (Math.PI / 180);
  return { x: from.x + Math.cos(rad) * dist, y: from.y + Math.sin(rad) * dist };
}

// Dimension tool: snaps only when close to horizontal or vertical (within
// AXIS_SNAP_THRESHOLD degrees); otherwise stays free-angle, since a dimension
// is measuring between two arbitrary existing points, not laying out a run.
function axisSnap(from, to){
  const dx = to.x - from.x, dy = to.y - from.y;
  const dist = Math.hypot(dx, dy);
  if(dist < 1) return to;
  const angle = Math.atan2(dy, dx) * (180 / Math.PI);
  const nearest = Math.round(angle / 90) * 90;
  if(Math.abs(angle - nearest) <= AXIS_SNAP_THRESHOLD){
    const rad = nearest * (Math.PI / 180);
    return { x: from.x + Math.cos(rad) * dist, y: from.y + Math.sin(rad) * dist };
  }
  return to;
}

function onPointerDown(e){
  state.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if(!state.pageViewport || twoFingersActive()) return;
  const p = canvasPoint(e);

  if(state.tool === 'select'){
    const hit = hitTestHandle(p) || hitTestMarkup(p);
    if(hit){
      state.selectedMarkupId = hit.markup.id;
      state.dragHandle = { markupId: hit.markup.id, key: hit.key, startPoint: p, origins: cloneMarkupPoints(hit.markup) };
      renderNoteList();
      drawAllMarkups();
      showMarkupActionButtons(hit.markup.id);
      return;
    }
    state.selectedMarkupId = null;
    clearMarkupActionButtons();
    drawAllMarkups();
    return;
  }

  if(state.tool === 'pan'){
    state.panState = { startX: e.clientX, startY: e.clientY, scrollLeft: $('#canvasArea').scrollLeft, scrollTop: $('#canvasArea').scrollTop };
    $('#canvasArea').classList.add('panning');
    return;
  }

  if(state.tool === 'draw'){
    state.drawing = true;
    state.currentStroke = { id: genId(), type: 'freehand', color: state.color, thickness: state.thickness, points: [p], note: '' };
  } else if(state.tool === 'line'){
    state.drawing = true;
    state.currentStroke = { id: genId(), type: 'line', color: state.color, thickness: state.thickness, p0: p, p1: p, note: '' };
  } else if(state.tool === 'multiline' || state.tool === 'hatcharea'){
    if(!state.multiPoints) state.multiPoints = [p];
    else state.multiPoints.push(state.tool === 'multiline' ? angleSnap(state.multiPoints[state.multiPoints.length - 1], p) : p);
    showRunDoneBtn();
    drawAllMarkups();
    if(state.tool === 'multiline') drawMultilinePreview(state.multiPoints);
    else drawHatchAreaPreview(state.multiPoints);
  } else if(state.tool === 'shape'){
    state.drawing = true;
    state.currentStroke = { id: genId(), type: 'shape', shape: state.shapeType, color: state.color, thickness: state.thickness, p0: p, p1: p, note: '' };
  } else if(state.tool === 'dimension'){
    state.drawing = true;
    state.currentStroke = { id: genId(), type: 'dimension', color: DEFAULT_DIMENSION_COLOR, thickness: state.thickness, p0: p, p1: p, text: '', textPos: p, note: '' };
  } else if(state.tool === 'hatchline'){
    state.drawing = true;
    state.currentStroke = { id: genId(), type: 'hatchline', color: HATCH_COLOR, thickness: state.thickness, p0: p, p1: p, note: '' };
  } else if(state.tool === 'label' || state.tool === 'note'){
    placeLeaderMarkup(state.tool, p);
  } else if(state.tool === 'erase'){
    eraseNear(p);
  }
}

// All shapes in the current set (circle/triangle/diamond/hexagon) are meant to
// stay regular/even — this locks the drag to a square bounding box so they
// can't be dragged into a distorted oval/stretched-triangle shape.
function squareLock(p0, rawP){
  const dx = rawP.x - p0.x, dy = rawP.y - p0.y;
  const size = Math.max(Math.abs(dx), Math.abs(dy));
  const sx = dx < 0 ? -1 : 1, sy = dy < 0 ? -1 : 1;
  return { x: p0.x + sx * size, y: p0.y + sy * size };
}

function onPointerMove(e){
  if(twoFingersActive()) return;
  const p = canvasPoint(e);

  if(state.tool === 'select' && state.dragHandle){
    applyDragHandle(state.dragHandle, p);
    drawAllMarkups();
    if(state.selectedMarkupId) positionMarkupActionButtons(state.selectedMarkupId);
    return;
  }
  if(state.tool === 'pan' && state.panState){
    const dx = e.clientX - state.panState.startX, dy = e.clientY - state.panState.startY;
    $('#canvasArea').scrollLeft = state.panState.scrollLeft - dx;
    $('#canvasArea').scrollTop = state.panState.scrollTop - dy;
    return;
  }

  if(state.tool === 'draw' && state.drawing){
    const last = state.currentStroke.points[state.currentStroke.points.length - 1];
    if(Math.hypot(p.x - last.x, p.y - last.y) > 3){
      state.currentStroke.points.push(p);
      drawAllMarkups();
      drawStroke(state.currentStroke);
    }
  } else if(state.tool === 'line' && state.drawing){
    state.currentStroke.p1 = angleSnap(state.currentStroke.p0, p);
    drawAllMarkups();
    drawLine(state.currentStroke);
  } else if(state.tool === 'shape' && state.drawing){
    state.currentStroke.p1 = squareLock(state.currentStroke.p0, p);
    drawAllMarkups();
    drawShape(state.currentStroke);
  } else if(state.tool === 'dimension' && state.drawing){
    state.currentStroke.p1 = axisSnap(state.currentStroke.p0, p);
    drawAllMarkups();
    drawDimensionPreview(state.currentStroke.p0, state.currentStroke.p1);
  } else if(state.tool === 'hatchline' && state.drawing){
    state.currentStroke.p1 = p;
    drawAllMarkups();
    drawHatchLinePreview(state.currentStroke.p0, state.currentStroke.p1);
  } else if(state.tool === 'multiline' && state.multiPoints){
    drawAllMarkups();
    const preview = state.multiPoints.concat([angleSnap(state.multiPoints[state.multiPoints.length - 1], p)]);
    drawMultilinePreview(preview);
  } else if(state.tool === 'hatcharea' && state.multiPoints){
    drawAllMarkups();
    drawHatchAreaPreview(state.multiPoints.concat([p]));
  }
}

function onPointerUp(e){
  if(state.tool === 'select' && state.dragHandle){
    state.dragHandle = null;
    markDirty();
    renderNoteList();
    if(state.selectedMarkupId) showMarkupActionButtons(state.selectedMarkupId);
    return;
  }
  if(state.tool === 'pan' && state.panState){
    state.panState = null;
    $('#canvasArea').classList.remove('panning');
    return;
  }

  if(state.tool === 'draw' && state.drawing){
    state.drawing = false;
    if(state.currentStroke.points.length > 1){
      state.currentStroke.createdAt = Date.now();
      activeSheet().markups.push(state.currentStroke);
      markDirty();
      renderNoteList();
    }
    state.currentStroke = null;
    drawAllMarkups();
  } else if(state.tool === 'line' && state.drawing){
    state.drawing = false;
    if(Math.hypot(state.currentStroke.p1.x - state.currentStroke.p0.x, state.currentStroke.p1.y - state.currentStroke.p0.y) > 4){
      state.currentStroke.createdAt = Date.now();
      activeSheet().markups.push(state.currentStroke);
      markDirty();
      renderNoteList();
    }
    state.currentStroke = null;
    drawAllMarkups();
  } else if(state.tool === 'shape' && state.drawing){
    state.drawing = false;
    if(Math.hypot(state.currentStroke.p1.x - state.currentStroke.p0.x, state.currentStroke.p1.y - state.currentStroke.p0.y) > 4){
      state.currentStroke.createdAt = Date.now();
      activeSheet().markups.push(state.currentStroke);
      markDirty();
      renderNoteList();
    }
    state.currentStroke = null;
    drawAllMarkups();
  } else if(state.tool === 'hatchline' && state.drawing){
    state.drawing = false;
    if(Math.hypot(state.currentStroke.p1.x - state.currentStroke.p0.x, state.currentStroke.p1.y - state.currentStroke.p0.y) > 4){
      state.currentStroke.createdAt = Date.now();
      activeSheet().markups.push(state.currentStroke);
      markDirty();
      renderNoteList();
    }
    state.currentStroke = null;
    drawAllMarkups();
  } else if(state.tool === 'dimension' && state.drawing){
    state.drawing = false;
    const dim = state.currentStroke;
    state.currentStroke = null;
    if(Math.hypot(dim.p1.x - dim.p0.x, dim.p1.y - dim.p0.y) > 4){
      showModal({
        title: 'Dimension text', placeholder: 'e.g. 12\'-6" or 4" CU', withSymbols: true, confirmLabel: 'Add',
        onConfirm: (text) => {
          if(!text) return;
          dim.text = text;
          dim.textPos = { x: (dim.p0.x + dim.p1.x) / 2, y: (dim.p0.y + dim.p1.y) / 2 - 16 };
          dim.createdAt = Date.now();
          activeSheet().markups.push(dim);
          markDirty();
          renderNoteList();
          drawAllMarkups();
        }
      });
    } else {
      drawAllMarkups();
    }
  }
}

/* ---- Run tool "Done" button — also used to finish a freeform hatch area,
   since both are the same "tap points, then finish" interaction pattern. ---- */
function showRunDoneBtn(){ $('#runDoneBtn').classList.remove('hidden'); }
function hideRunDoneBtn(){ $('#runDoneBtn').classList.add('hidden'); }
function finishMultiline(){
  if(state.multiPoints && state.multiPoints.length > 1){
    if(state.tool === 'hatcharea' && state.multiPoints.length >= 3){
      const markup = { id: genId(), type: 'hatcharea', color: HATCH_COLOR, points: state.multiPoints, note: '', createdAt: Date.now() };
      activeSheet().markups.push(markup);
      markDirty();
      renderNoteList();
    } else if(state.tool === 'multiline'){
      const markup = { id: genId(), type: 'multiline', color: state.color, thickness: state.thickness, points: state.multiPoints, note: '', createdAt: Date.now() };
      activeSheet().markups.push(markup);
      markDirty();
      renderNoteList();
    }
  }
  state.multiPoints = null;
  hideRunDoneBtn();
  drawAllMarkups();
}
$('#runDoneBtn').addEventListener('click', finishMultiline);

function onDblClick(){
  if((state.tool === 'multiline' || state.tool === 'hatcharea') && state.multiPoints && state.multiPoints.length > 1) finishMultiline();
}

/* ---- Label / Note placement (single tap places with sensible default leader shape,
   then it's fully adjustable via drag handles in the Select tool) ---- */
function placeLeaderMarkup(kind, anchor){
  const defaultColor = kind === 'note' ? DEFAULT_NOTE_COLOR : DEFAULT_LABEL_COLOR;
  showModal({
    title: kind === 'note' ? 'Add note' : 'Add label',
    placeholder: kind === 'note' ? 'e.g. "Relocated per RFI 12"' : 'e.g. 6" CU',
    withSymbols: true, confirmLabel: 'Add',
    onConfirm: (text) => {
      if(!text) return;
      const textPos = { x: anchor.x + 70, y: anchor.y - 60 };
      const markup = {
        id: genId(), type: kind, color: defaultColor, text, anchor, textPos,
        note: '', createdAt: Date.now(),
      };
      activeSheet().markups.push(markup);
      state.selectedMarkupId = markup.id;
      markDirty();
      drawAllMarkups();
      renderNoteList();
      showMarkupActionButtons(markup.id);
    }
  });
}

// Bluebeam-style callout geometry: the bend is never a handle the user drags —
// it's always recomputed from the two real handles (anchor + textPos) so the
// segment nearest the text stays a fixed-length horizontal stub, and the far
// segment always points straight at wherever the anchor currently is.
function computeLeaderBend(anchor, textPos){
  const dir = anchor.x >= textPos.x ? 1 : -1;
  return { x: textPos.x + dir * LEADER_STUB_LENGTH, y: textPos.y };
}

/* ============================================================
   SELECTION / HANDLE HIT-TESTING + DRAGGING
   ============================================================ */
function handlePointsForMarkup(m){
  if(m.type === 'label' || m.type === 'note') return [{ key: 'anchor', p: m.anchor }, { key: 'textPos', p: m.textPos }];
  if(m.type === 'dimension') return [{ key: 'p0', p: m.p0 }, { key: 'p1', p: m.p1 }, { key: 'textPos', p: m.textPos }];
  if(m.type === 'line' || m.type === 'hatchline') return [{ key: 'p0', p: m.p0 }, { key: 'p1', p: m.p1 }];
  if(m.type === 'shape') return [{ key: 'p0', p: m.p0 }, { key: 'p1', p: m.p1 }];
  if(m.type === 'multiline' || m.type === 'hatcharea') return m.points.map((p, i) => ({ key: 'pt' + i, p }));
  return [];
}
function cloneMarkupPoints(m){ return JSON.parse(JSON.stringify(m)); }
function referencePointForMarkup(m){
  if(m.type === 'label' || m.type === 'note' || m.type === 'dimension') return m.textPos;
  if(m.type === 'line' || m.type === 'shape' || m.type === 'hatchline') return { x: Math.min(m.p0.x, m.p1.x), y: Math.min(m.p0.y, m.p1.y) };
  if(m.type === 'multiline' || m.type === 'freehand' || m.type === 'hatcharea'){
    return m.points.reduce((acc, pt) => (pt.y < acc.y ? pt : acc), m.points[0]);
  }
  return { x: 0, y: 0 };
}

function hitTestHandle(p){
  const sheet = activeSheet();
  if(!sheet || !state.selectedMarkupId) return null;
  const m = sheet.markups.find(x => x.id === state.selectedMarkupId);
  if(!m) return null;
  for(const h of handlePointsForMarkup(m)){
    if(Math.hypot(p.x - h.p.x, p.y - h.p.y) < 16) return { markup: m, key: h.key };
  }
  return null;
}
function hitTestMarkup(p){
  const sheet = activeSheet();
  if(!sheet) return null;
  const found = sheet.markups.slice().reverse().find(m => markupContainsPoint(m, p));
  return found ? { markup: found, key: 'whole' } : null;
}
function markupContainsPoint(m, p){
  if(m.type === 'freehand' || m.type === 'multiline' || m.type === 'hatcharea') return m.points.some(pt => Math.hypot(p.x - pt.x, p.y - pt.y) < 16);
  if(m.type === 'line' || m.type === 'hatchline' || m.type === 'dimension') return distToSegment(p, m.p0, m.p1) < 12 || (m.textPos && Math.hypot(p.x - m.textPos.x, p.y - m.textPos.y) < 24);
  if(m.type === 'shape'){
    const x0 = Math.min(m.p0.x, m.p1.x), x1 = Math.max(m.p0.x, m.p1.x);
    const y0 = Math.min(m.p0.y, m.p1.y), y1 = Math.max(m.p0.y, m.p1.y);
    return p.x >= x0 - 6 && p.x <= x1 + 6 && p.y >= y0 - 6 && p.y <= y1 + 6;
  }
  if(m.type === 'label' || m.type === 'note') return Math.hypot(p.x - m.textPos.x, p.y - m.textPos.y) < 40 || Math.hypot(p.x - m.anchor.x, p.y - m.anchor.y) < 16;
  return false;
}
function distToSegment(p, a, b){
  const l2 = (b.x - a.x) ** 2 + (b.y - a.y) ** 2;
  if(l2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
  let t = ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t * (b.x - a.x)), p.y - (a.y + t * (b.y - a.y)));
}

function applyDragHandle(drag, p){
  const sheet = activeSheet();
  const m = sheet.markups.find(x => x.id === drag.markupId);
  if(!m) return;
  if(drag.key === 'whole'){
    const dx = p.x - drag.startPoint.x, dy = p.y - drag.startPoint.y;
    translateMarkup(m, drag.origins, dx, dy);
    return;
  }
  if(drag.key.startsWith('pt')){
    const idx = parseInt(drag.key.slice(2), 10);
    m.points[idx] = p;
    return;
  }
  m[drag.key] = p;
}
function translateMarkup(m, origin, dx, dy){
  if(m.type === 'freehand' || m.type === 'multiline' || m.type === 'hatcharea'){
    m.points = origin.points.map(pt => ({ x: pt.x + dx, y: pt.y + dy }));
  } else if(m.type === 'line' || m.type === 'shape' || m.type === 'hatchline'){
    m.p0 = { x: origin.p0.x + dx, y: origin.p0.y + dy };
    m.p1 = { x: origin.p1.x + dx, y: origin.p1.y + dy };
  } else if(m.type === 'dimension'){
    m.p0 = { x: origin.p0.x + dx, y: origin.p0.y + dy };
    m.p1 = { x: origin.p1.x + dx, y: origin.p1.y + dy };
    m.textPos = { x: origin.textPos.x + dx, y: origin.textPos.y + dy };
  } else if(m.type === 'label' || m.type === 'note'){
    m.anchor = { x: origin.anchor.x + dx, y: origin.anchor.y + dy };
    m.textPos = { x: origin.textPos.x + dx, y: origin.textPos.y + dy };
  }
}

function eraseNear(p){
  const sheet = activeSheet();
  const idx = sheet.markups.findIndex(m => markupContainsPoint(m, p));
  if(idx > -1){
    if(sheet.markups[idx].id === state.selectedMarkupId) state.selectedMarkupId = null;
    sheet.markups.splice(idx, 1);
    markDirty();
    drawAllMarkups();
    renderNoteList();
    clearMarkupActionButtons();
  }
}

/* ---- Floating action buttons for the Select tool: "Edit text" (label/note only)
   and "Delete" (every markup type) — Select can fully manage a markup without
   switching to the Erase tool. ---- */
function clearMarkupActionButtons(){
  const el = document.getElementById('markupActionGroup');
  if(el) el.remove();
}
function positionMarkupActionButtons(markupId){
  const group = document.getElementById('markupActionGroup');
  if(!group) return;
  const sheet = activeSheet();
  const m = sheet && sheet.markups.find(x => x.id === markupId);
  if(!m) return;
  const rect = mCanvas.getBoundingClientRect();
  const scaleX = rect.width / mCanvas.width, scaleY = rect.height / mCanvas.height;
  const refP = referencePointForMarkup(m);
  group.style.left = (rect.left + refP.x * scaleX) + 'px';
  group.style.top = (rect.top + refP.y * scaleY - 34) + 'px';
}
function showMarkupActionButtons(markupId){
  clearMarkupActionButtons();
  const sheet = activeSheet();
  const m = sheet && sheet.markups.find(x => x.id === markupId);
  if(!m) return;
  const group = document.createElement('div');
  group.id = 'markupActionGroup';
  group.className = 'markup-action-group';
  if(m.type === 'label' || m.type === 'note' || m.type === 'dimension'){
    const editBtn = document.createElement('button');
    editBtn.textContent = 'Edit text';
    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      showModal({
        title: m.type === 'note' ? 'Edit note' : (m.type === 'dimension' ? 'Edit dimension text' : 'Edit label'),
        value: m.text, withSymbols: true, confirmLabel: 'Save',
        onConfirm: (text) => {
          if(!text) return;
          m.text = text;
          markDirty();
          drawAllMarkups();
          renderNoteList();
          positionMarkupActionButtons(markupId);
        }
      });
    });
    group.appendChild(editBtn);
  }
  if(m.type === 'line' || m.type === 'multiline'){
    const hatchBtn = document.createElement('button');
    hatchBtn.textContent = m.hatched ? 'Un-hatch' : 'Hatch';
    hatchBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      m.hatched = !m.hatched;
      markDirty();
      drawAllMarkups();
      renderNoteList();
      showMarkupActionButtons(markupId);
    });
    group.appendChild(hatchBtn);
  }
  const delBtn = document.createElement('button');
  delBtn.className = 'delete-btn';
  delBtn.textContent = 'Delete';
  delBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const idx = sheet.markups.findIndex(x => x.id === markupId);
    if(idx > -1) sheet.markups.splice(idx, 1);
    state.selectedMarkupId = null;
    markDirty(); drawAllMarkups(); renderNoteList(); clearMarkupActionButtons();
  });
  group.appendChild(delBtn);
  document.body.appendChild(group);
  positionMarkupActionButtons(markupId);
}

/* ============================================================
   RENDERING
   ============================================================ */
function smoothPoints(points){
  if(points.length < 3) return points;
  // Two passes of a wider 5-point average — noticeably smoother than a single
  // 3-point pass, while still tracking the overall shape the person drew.
  let pass = points;
  for(let iter = 0; iter < 2; iter++){
    const out = [pass[0]];
    for(let i = 1; i < pass.length - 1; i++){
      const i0 = Math.max(0, i - 2), i1 = Math.min(pass.length - 1, i + 2);
      let sx = 0, sy = 0, n = 0;
      for(let k = i0; k <= i1; k++){ sx += pass[k].x; sy += pass[k].y; n++; }
      out.push({ x: sx / n, y: sy / n });
    }
    out.push(pass[pass.length - 1]);
    pass = out;
  }
  return pass;
}

function drawAllMarkups(){
  const ctx = mCanvas.getContext('2d');
  ctx.clearRect(0, 0, mCanvas.width, mCanvas.height);
  const sheet = activeSheet();
  if(!sheet) return;
  sheet.markups.forEach(m => {
    if(m.type === 'freehand') drawStroke(m);
    else if(m.type === 'line') drawLine(m);
    else if(m.type === 'multiline') drawMultiline(m);
    else if(m.type === 'shape') drawShape(m);
    else if(m.type === 'label' || m.type === 'note') drawLeader(m);
    else if(m.type === 'dimension') drawDimension(m);
    else if(m.type === 'hatchline') drawHatchLine(m);
    else if(m.type === 'hatcharea') drawHatchArea(m);
  });
  if(state.selectedMarkupId){
    const m = sheet.markups.find(x => x.id === state.selectedMarkupId);
    if(m) drawHandles(m);
  }
}

function drawHandles(m){
  const ctx = mCanvas.getContext('2d');
  handlePointsForMarkup(m).forEach(h => {
    ctx.beginPath();
    ctx.arc(h.p.x, h.p.y, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#E8622C';
    ctx.stroke();
  });
}

function drawStroke(stroke){
  const ctx = mCanvas.getContext('2d');
  const pts = smoothPoints(stroke.points);
  if(pts.length < 2) return;
  ctx.strokeStyle = stroke.color;
  ctx.lineWidth = stroke.thickness || 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i = 1; i < pts.length - 1; i++){
    const midX = (pts[i].x + pts[i + 1].x) / 2, midY = (pts[i].y + pts[i + 1].y) / 2;
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, midX, midY);
  }
  ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
  ctx.stroke();
}

function drawLine(m){
  const ctx = mCanvas.getContext('2d');
  ctx.strokeStyle = m.color;
  ctx.lineWidth = m.thickness || 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(m.p0.x, m.p0.y);
  ctx.lineTo(m.p1.x, m.p1.y);
  ctx.stroke();
  if(m.hatched) drawHatchTicksAlongPath(ctx, [m.p0, m.p1]);
}

// Rounded-joint polyline: draws straight segments with a fixed-radius arc at
// each interior vertex, so multi-bend runs read as smooth elbows rather than
// sharp mitered corners. Diagrammatic, not a precise engineering radius.
function drawMultiline(m){
  const ctx = mCanvas.getContext('2d');
  ctx.strokeStyle = m.color;
  ctx.lineWidth = m.thickness || 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  drawRoundedPolyline(ctx, m.points, JOINT_RADIUS);
  if(m.hatched) drawHatchTicksAlongPath(ctx, m.points);
}
function drawMultilinePreview(points){
  const ctx = mCanvas.getContext('2d');
  ctx.save();
  ctx.strokeStyle = state.color;
  ctx.lineWidth = state.thickness || 3;
  ctx.globalAlpha = 0.6;
  drawRoundedPolyline(ctx, points, JOINT_RADIUS);
  ctx.restore();
}
function drawRoundedPolyline(ctx, points, radius){
  if(points.length < 2) return;
  if(points.length === 2){
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    ctx.lineTo(points[1].x, points[1].y);
    ctx.stroke();
    return;
  }
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for(let i = 1; i < points.length - 1; i++){
    const p0 = points[i - 1], p1 = points[i], p2 = points[i + 1];
    const d1 = Math.hypot(p1.x - p0.x, p1.y - p0.y), d2 = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    const r = Math.min(radius, d1 / 2, d2 / 2);
    const t1 = r / (d1 || 1), t2 = r / (d2 || 1);
    const preP = { x: p1.x + (p0.x - p1.x) * t1, y: p1.y + (p0.y - p1.y) * t1 };
    const postP = { x: p1.x + (p2.x - p1.x) * t2, y: p1.y + (p2.y - p1.y) * t2 };
    ctx.lineTo(preP.x, preP.y);
    ctx.quadraticCurveTo(p1.x, p1.y, postP.x, postP.y);
  }
  ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
  ctx.stroke();
}

function drawShape(m){
  const ctx = mCanvas.getContext('2d');
  ctx.strokeStyle = m.color;
  ctx.lineWidth = m.thickness || 3;
  const x0 = Math.min(m.p0.x, m.p1.x), y0 = Math.min(m.p0.y, m.p1.y);
  const w = Math.abs(m.p1.x - m.p0.x), h = Math.abs(m.p1.y - m.p0.y);
  const cx = x0 + w / 2, cy = y0 + h / 2;
  ctx.beginPath();
  if(m.shape === 'circle'){
    const r = Math.min(w, h) / 2;
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
  } else if(m.shape === 'oval'){
    ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
  } else if(m.shape === 'rect'){
    ctx.rect(x0, y0, w, h);
  } else if(m.shape === 'triangle'){
    ctx.moveTo(cx, y0); ctx.lineTo(x0 + w, y0 + h); ctx.lineTo(x0, y0 + h); ctx.closePath();
  } else if(m.shape === 'diamond'){
    ctx.moveTo(cx, y0); ctx.lineTo(x0 + w, cy); ctx.lineTo(cx, y0 + h); ctx.lineTo(x0, cy); ctx.closePath();
  } else if(m.shape === 'hexagon'){
    const pts = [];
    for(let i = 0; i < 6; i++){
      const ang = Math.PI / 3 * i - Math.PI / 2;
      pts.push({ x: cx + (w / 2) * Math.cos(ang), y: cy + (h / 2) * Math.sin(ang) });
    }
    ctx.moveTo(pts[0].x, pts[0].y);
    pts.slice(1).forEach(pt => ctx.lineTo(pt.x, pt.y));
    ctx.closePath();
  }
  ctx.stroke();
}

// Shared arrowhead: draws a filled triangle at `tip`, pointing in the direction
// of travel from `from` to `tip`. Used by both Note's leader and Dimension's
// two end-arrows so they render identically.
function drawArrowHead(ctx, from, tip, color, size = 9){
  const ang = Math.atan2(tip.y - from.y, tip.x - from.x);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(tip.x, tip.y);
  ctx.lineTo(tip.x - size * Math.cos(ang - 0.4), tip.y - size * Math.sin(ang - 0.4));
  ctx.lineTo(tip.x - size * Math.cos(ang + 0.4), tip.y - size * Math.sin(ang + 0.4));
  ctx.closePath();
  ctx.fill();
}

function drawTextPill(ctx, text, pos, color){
  ctx.font = '600 13px Inter, sans-serif';
  const padX = 8;
  const textW = ctx.measureText(text).width;
  const boxW = textW + padX * 2, boxH = 22;
  const bx = pos.x, by = pos.y - boxH / 2;
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  roundRect(ctx, bx, by, boxW, boxH, 6);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.fillText(text, bx + padX, by + boxH / 2 + 4);
  return { x: bx, y: by, w: boxW, h: boxH };
}

// Shared leader renderer for both Label (dot tip) and Note (arrow tip). The
// bend is always computed fresh from anchor+textPos (Bluebeam-callout style) —
// it is never read from stored data, so old saved markups migrate silently.
function drawLeader(m){
  const ctx = mCanvas.getContext('2d');
  const bend = computeLeaderBend(m.anchor, m.textPos);
  ctx.strokeStyle = m.color;
  ctx.fillStyle = m.color;
  ctx.lineWidth = 1.5;

  ctx.beginPath();
  ctx.moveTo(m.textPos.x, m.textPos.y);
  ctx.lineTo(bend.x, bend.y);
  ctx.lineTo(m.anchor.x, m.anchor.y);
  ctx.stroke();

  if(m.type === 'note') drawArrowHead(ctx, bend, m.anchor, m.color);
  else {
    ctx.beginPath();
    ctx.arc(m.anchor.x, m.anchor.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  drawTextPill(ctx, m.text, m.textPos, m.color);
}

// Dimension: a straight line between two picked points, arrowheads at both
// ends, and independently-draggable text (not attached by a leader).
function drawDimension(m){
  const ctx = mCanvas.getContext('2d');
  ctx.strokeStyle = m.color;
  ctx.lineWidth = m.thickness || 2;
  ctx.beginPath();
  ctx.moveTo(m.p0.x, m.p0.y);
  ctx.lineTo(m.p1.x, m.p1.y);
  ctx.stroke();
  drawArrowHead(ctx, m.p1, m.p0, m.color);
  drawArrowHead(ctx, m.p0, m.p1, m.color);
  if(m.text) drawTextPill(ctx, m.text, m.textPos, m.color);
}
function drawDimensionPreview(p0, p1){
  const ctx = mCanvas.getContext('2d');
  ctx.save();
  ctx.globalAlpha = 0.6;
  ctx.strokeStyle = DEFAULT_DIMENSION_COLOR;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(p0.x, p0.y);
  ctx.lineTo(p1.x, p1.y);
  ctx.stroke();
  drawArrowHead(ctx, p1, p0, DEFAULT_DIMENSION_COLOR);
  drawArrowHead(ctx, p0, p1, DEFAULT_DIMENSION_COLOR);
  ctx.restore();
}

// Repeated short diagonal ticks along a path — the shared "struck through /
// crossed out" convention used by the standalone Hatch Line tool AND as an
// overlay toggle on an existing Line/Run markup.
function drawHatchTicksAlongPath(ctx, points, color = HATCH_COLOR){
  if(points.length < 2) return;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  let carry = 0;
  for(let i = 0; i < points.length - 1; i++){
    const a = points[i], b = points[i + 1];
    const segLen = Math.hypot(b.x - a.x, b.y - a.y);
    if(segLen < 0.01) continue;
    const ux = (b.x - a.x) / segLen, uy = (b.y - a.y) / segLen;
    const nx = -uy, ny = ux; // perpendicular
    let d = HATCH_TICK_SPACING - carry;
    while(d < segLen){
      const cx = a.x + ux * d, cy = a.y + uy * d;
      const half = HATCH_TICK_LENGTH / 2;
      ctx.beginPath();
      ctx.moveTo(cx - (ux + nx) * half, cy - (uy + ny) * half);
      ctx.lineTo(cx + (ux + nx) * half, cy + (uy + ny) * half);
      ctx.stroke();
      d += HATCH_TICK_SPACING;
    }
    carry = (carry + segLen) % HATCH_TICK_SPACING;
  }
  ctx.restore();
}
function drawHatchLine(m){
  const ctx = mCanvas.getContext('2d');
  drawHatchTicksAlongPath(ctx, [m.p0, m.p1], m.color);
}
function drawHatchLinePreview(p0, p1){
  const ctx = mCanvas.getContext('2d');
  ctx.save();
  ctx.globalAlpha = 0.6;
  drawHatchTicksAlongPath(ctx, [p0, p1], HATCH_COLOR);
  ctx.restore();
}

// Freeform hatched area: closed outline + diagonal hatch fill clipped to the
// traced polygon — the standard "this was demolished" convention.
function drawHatchArea(m){ renderHatchAreaPolygon(mCanvas.getContext('2d'), m.points, m.color, true); }
function drawHatchAreaPreview(points){ renderHatchAreaPolygon(mCanvas.getContext('2d'), points, HATCH_COLOR, false); }
function renderHatchAreaPolygon(ctx, points, color, closed){
  if(points.length < 2) return;
  ctx.save();
  if(!closed) ctx.globalAlpha = 0.6;

  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  points.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
  if(closed) ctx.closePath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();

  if(closed && points.length > 2){
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    points.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
    ctx.closePath();
    ctx.clip();
    const xs = points.map(p => p.x), ys = points.map(p => p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    const span = (maxX - minX) + (maxY - minY) + 40;
    for(let d = -span; d < span; d += HATCH_TICK_SPACING){
      ctx.beginPath();
      ctx.moveTo(minX + d, minY);
      ctx.lineTo(minX + d + (maxY - minY), maxY);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ============================================================
   NOTES PANEL
   ============================================================ */
function renderNoteList(){
  const list = $('#noteList');
  const sheet = activeSheet();
  if(!sheet || sheet.markups.length === 0){
    list.innerHTML = '<div class="panel-empty">No markups yet.</div>';
    $('#noteCount').textContent = '0 markups';
    return;
  }
  $('#noteCount').textContent = sheet.markups.length + ' markup' + (sheet.markups.length === 1 ? '' : 's');
  list.innerHTML = '';
  sheet.markups.slice().reverse().forEach(m => {
    const card = document.createElement('div');
    card.className = 'note-card' + (m.id === state.selectedMarkupId ? ' selected' : '');
    const time = m.createdAt ? new Date(m.createdAt).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
    const label = (m.type === 'label' || m.type === 'note' || m.type === 'dimension') ? m.text
      : (m.type === 'shape') ? m.shape
      : (m.type === 'hatchline') ? 'hatch line'
      : (m.type === 'hatcharea') ? 'hatch area'
      : (m.type === 'line' && m.hatched) ? 'line (hatched)'
      : (m.type === 'multiline' && m.hatched) ? 'run (hatched)'
      : m.type;
    const noteText = m.note ? escapeHtml(m.note) : '<span class="nc-empty">No note added</span>';
    card.innerHTML = `
      <div class="nc-top"><span class="nc-type">${escapeHtml(m.type)}</span><span class="nc-time">${time}</span></div>
      <div class="nc-text"><strong>${escapeHtml(label)}</strong><br>${noteText}</div>`;
    card.addEventListener('click', () => {
      showModal({
        title: 'Note', value: m.note || '', placeholder: 'Add a note about this markup', confirmLabel: 'Save',
        onConfirm: (text) => { m.note = text; markDirty(); renderNoteList(); }
      });
    });
    list.appendChild(card);
  });
}

/* ============================================================
   SAVE / DIRTY STATE
   ============================================================ */
function markDirty(){
  state.dirty = true;
  setStatus('dirty', 'Unsaved changes');
}
function setStatus(kind, text){
  $('#statusText').textContent = text;
  $('#statusDot').classList.toggle('dirty', kind !== 'saved');
  $('#saveBtn').disabled = kind === 'saved' || !state.jobId;
}
$('#saveBtn').addEventListener('click', saveJob);

async function saveJob(){
  if(!state.jobId) return;
  setStatus('loading', 'Saving…');
  try{
    const result = await AppCore.writeJsonFile(state.fileName, state.data, state.lastModified);
    state.lastModified = result.lastModified;
    state.dirty = false;
    setStatus('saved', 'All changes saved');
    upsertJobsIndex(state.jobId, state.jobName);
  }catch(e){
    if(e.isConflict){
      showModal({ title: 'Update conflict', sub: 'This job was updated by someone else since you opened it. Reload the job to see the latest before saving again.', confirmLabel: 'OK', onConfirm: () => {} });
    } else {
      showModal({ title: 'Save failed', sub: e.message || 'Unknown error', confirmLabel: 'OK', onConfirm: () => {} });
    }
    setStatus('dirty', 'Save failed — changes not saved');
  }
}

window.addEventListener('beforeunload', (e) => {
  if(state.dirty){ e.preventDefault(); e.returnValue = ''; }
});
window.addEventListener('resize', () => { if(state.selectedMarkupId) positionMarkupActionButtons(state.selectedMarkupId); });
</script>
