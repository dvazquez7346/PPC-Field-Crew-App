async function submitManageBatch(){
  const { jobSiteId, roleOnSite, startDate, shift, workArea, notes, endExisting } = state.batchForm;
  if(!jobSiteId){ showToast('Select a target job site'); return; }
  if(!startDate){ showToast('Start date is required'); return; }
  const ids = Array.from(state.batchSelectedIds);
  if(ids.length===0){ showToast('Select at least one crew member'); return; }
  const t = todayISO();
  const toEnd = [];
  const toCreate = [];
  const skipped = [];
  ids.forEach(empId => {
    const emp = getEmployee(empId);
    if(!endExisting && hasActiveAssignmentOnSite(empId, jobSiteId)){
      skipped.push(emp?.name || 'Unknown');
      return;
    }
    if(endExisting){
      state.assignments.filter(a => a.employeeId===empId && (!a.endDate || a.endDate>=t))
        .forEach(a => toEnd.push({ ...a, endDate: dayBeforeISO(startDate) }));
    }
    toCreate.push({
      id: genId(), employeeId: empId, jobSiteId,
      startDate, endDate:'', roleOnSite: roleOnSite || (emp?.classification||''),
      shift: shift||'Day', workArea:(workArea||'').trim(), notes:(notes||'').trim(),
    });
  });
  if(toCreate.length===0){
    showToast(skipped.length ? `Everyone selected is already active on this site.` : 'Nothing to assign.');
    return;
  }
  try{
    for(const a of toEnd) await saveRecord('assignment', a);
    for(const a of toCreate) await saveRecord('assignment', a);
  }catch(err){ return; }
  showToast(`${toCreate.length} crew member${toCreate.length>1?'s':''} assigned${skipped.length ? ` — ${skipped.length} skipped (already on crew): ${skipped.join(', ')}` : ''}`);
  state.batchSelectedIds = new Set();
  render();
}

function bindSettings(){
  const sw = document.querySelector('[data-switch-role]');
  if(sw) sw.addEventListener('click', () => { state.role = null; render(); });
  const rf = document.querySelector('[data-force-refresh]');
  if(rf) rf.addEventListener('click', () => { loadAll().then(()=>showToast('Directory refreshed')); });
  const so = document.querySelector('[data-signout]');
  if(so) so.addEventListener('click', signOut);
}

function renderModal(){

function renderTransferModal(m){

          </select>
          ${destSites.length===0 ? `<div style="font-size:11px;color:var(--muted);margin-top:6px">No other eligible job sites available to transfer to.</div>` : ''}

function renderAssignForemanModal(m){
  const { site, trade, scope } = m.data;

  const currentForemanId = foremenByTrade[trade] || '';
  let candidates;
  if(isCrewScope){
    candidates = assignmentsForSite(site.id).map(a => getEmployee(a.employeeId)).filter(e => e && e.trade===trade).sort((a,b)=>a.name.localeCompare(b.name));
  }else{
    candidates = activeEmployeesList().filter(e => e.status==='Active' && e.trade===trade).sort((a,b)=>a.name.localeCompare(b.name));
  }
  return `
  <div class="modal-backdrop" data-backdrop>
    <div class="modal">

        <div class="field-row">
          <div class="field"><label>Zip Code</label><input name="zip" value="${escapeHtml(d.zip||'')}"></div>
          <div class="field"><label>Status</label><select name="status">${['Active','Upcoming','Completed','On Hold'].map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Start Date</label><input name="startDate" type="date" value="${escapeHtml(d.startDate||'')}"></div>
          <div class="field"><label>End Date</label><input name="endDate" type="date" value="${escapeHtml(d.endDate||'')}"></div>
        </div>
        <div class="field">
          <label>Project Manager <span style="text-transform:none;font-weight:500;color:var(--muted)">(optional)</span></label>
          <select name="pmId">
            <option value="">— None —</option>
            ${pmCandidates.map(e => `<option value="${e.id}" ${d.pmId===e.id?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}
          </select>
          ${pmCandidates.length===0 ? `<div style="font-size:11px;color:var(--muted);margin-top:6px">No employees are classified as PM yet — add one from Crew first.</div>` : ''}
        </div>
        <div class="field">
          <label>Trades on This Job <span style="text-transform:none;font-weight:500;color:var(--muted)">(optional)</span></label>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px">
            ${TRADE_OPTS.map(t => `
              <label style="display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer">
                <input type="checkbox" name="trade_${t}" ${(d.plannedTrades||[]).includes(t)?'checked':''} style="width:16px;height:16px">
                ${escapeHtml(t)}
              </label>
            `).join('')}
          </div>
          <div style="font-size:11px;color:var(--muted);margin-top:6px">Picking trades here makes them selectable on the Job Site page right away, even before anyone's assigned.</div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin:-4px 0 14px">Foreman is now set per trade from the Job Site Detail page, once crew is assigned.</div>
        <div class="field"><label>Special Instructions</label><textarea name="parkingInstructions" placeholder="e.g. Parking, gate codes, badge requirements, site access notes">${escapeHtml(d.parkingInstructions||'')}</textarea></div>
        <div class="field"><label>Notes</label><textarea name="notes">${escapeHtml(d.notes||'')}</textarea></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary btn-block" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary btn-block">Save</button>
        </div>
      </form>
    </div>
  </div>`;
}
function renderAssignmentModal(m){
  const d = m.data;
  let activeEmps = activeEmployeesList().filter(e => e.status==='Active').sort((a,b)=>a.name.localeCompare(b.name));
  if(m.tradeFilter) activeEmps = activeEmps.filter(e => e.trade === m.tradeFilter);
  let openSites = state.jobsites.filter(s => s.status==='Active' || s.status==='Upcoming').sort((a,b)=>a.name.localeCompare(b.name));
  const isScopedForeman = !canEdit() && state.role === 'Foreman' && !state.demoMode;
  if(isScopedForeman){
    const mySiteIds = foremanSiteIds();
    openSites = openSites.filter(s => mySiteIds.includes(s.id));
  }
  return `
  <div class="modal-backdrop" data-backdrop>
    <div class="modal">
      <div class="modal-header"><h2 class="modal-title">${m.mode==='new'?'New Assignment':'Edit Assignment'}</h2><button class="close-btn" data-close-modal>${ic('close')}</button></div>
      <form id="assignment-form">
        <div class="field"><label>Crew Member <span class="req-star">*</span></label>
          ${m.mode === 'edit' ? `
            <input type="hidden" name="employeeId" value="${d.employeeId}">
            <input value="${escapeHtml(getEmployee(d.employeeId)?.name || 'Unknown employee')}" disabled style="opacity:0.7">
            <div style="font-size:11px;color:var(--muted);margin-top:5px">To swap who's in this assignment, <strong>Unassign</strong> them and create a new assignment for the correct person instead.</div>
          ` : `<select name="employeeId" required><option value="">Select crew member…</option>${activeEmps.map(e=>`<option value="${e.id}" ${d.employeeId===e.id?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}</select>`}
          ${m.mode !== 'edit' && m.tradeFilter ? `<div style="font-size:11px;color:var(--muted);margin-top:5px">Only ${escapeHtml(m.tradeFilter)} employees are shown.${activeEmps.length===0?' None are currently available.':''}</div>` : ''}
        </div>
        <div class="field"><label>Job Site <span class="req-star">*</span></label>
          ${m.mode === 'edit' ? `
            <input type="hidden" name="jobSiteId" value="${d.jobSiteId}">
            <input value="${escapeHtml(getJobSite(d.jobSiteId)?.name || 'Unknown site')}" disabled style="opacity:0.7">
            <div style="font-size:11px;color:var(--muted);margin-top:5px">To move this person to a different site, use <strong>Transfer</strong> from that job site's Assigned Crew section instead.</div>
          ` : isScopedForeman && openSites.length===1 ? `
            <input type="hidden" name="jobSiteId" value="${openSites[0].id}">
            <input value="${escapeHtml(openSites[0].name)}" disabled style="opacity:0.7">
          ` : `<select name="jobSiteId" required><option value="">Select job site…</option>${openSites.map(s=>`<option value="${s.id}" ${d.jobSiteId===s.id?'selected':''}>${escapeHtml(s.name)}${s.projectNumber?` — ${escapeHtml(s.projectNumber)}`:''}</option>`).join('')}</select>`}
          ${m.mode !== 'edit' && isScopedForeman ? `<div style="font-size:11px;color:var(--muted);margin-top:5px">As a Foreman, you can only assign crew to your own site${openSites.length!==1?'s':''}.</div>` : ''}
        </div>
        <div class="field-row">
          <div class="field"><label>Start Date <span class="req-star">*</span></label><input name="startDate" type="date" required value="${escapeHtml(d.startDate||'')}"></div>
          <div class="field"><label>End Date</label><input name="endDate" type="date" value="${escapeHtml(d.endDate||'')}" placeholder="Blank = ongoing"></div>
        </div>
        <div class="field"><label>Role on Site</label>
          <select name="roleOnSite">
            <option value="">— Not set —</option>
            ${!d.roleOnSite || ROLE_ON_SITE_OPTS.includes(d.roleOnSite) ? '' : `<option value="${escapeHtml(d.roleOnSite)}" selected>${escapeHtml(d.roleOnSite)} (current)</option>`}
            ${ROLE_ON_SITE_OPTS.map(r=>`<option ${d.roleOnSite===r?'selected':''}>${r}</option>`).join('')}
          </select>
        </div>
        <div class="field-row">
          <div class="field"><label>Shift</label><select name="shift"><option ${(d.shift||'Day')==='Day'?'selected':''}>Day</option><option ${d.shift==='Swing'?'selected':''}>Swing</option><option ${d.shift==='Night'?'selected':''}>Night</option></select></div>
          <div class="field"><label>Work Area</label><input name="workArea" value="${escapeHtml(d.workArea||'')}" placeholder="e.g. Overall, North Wing"></div>
        </div>
        <div class="field"><label>Notes</label><textarea name="notes">${escapeHtml(d.notes||'')}</textarea></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary btn-block" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary btn-block">Save</button>
        </div>
      </form>
    </div>
  </div>`;
}
function bindModalEvents(){
  document.querySelectorAll('[data-close-modal]').forEach(el => el.addEventListener('click', () => { state.modal=null; render(); }));
  const backdrop = document.querySelector('[data-backdrop]');
  if(backdrop) backdrop.addEventListener('click', (e) => { if(e.target === backdrop){ state.modal=null; render(); } });

  document.querySelectorAll('[data-foreman-scope]').forEach(el => el.addEventListener('click', () => {
    const { site, trade } = state.modal.data;
    openAssignForemanModalWithScope(site.id, trade, el.dataset.foremanScope);
  }));
  const leaveBtn = document.querySelector('[data-foreman-leave]');
  if(leaveBtn) leaveBtn.addEventListener('click', () => { state.modal=null; render(); });
  const roleBtn = document.querySelector('[data-foreman-role]');
  if(roleBtn) roleBtn.addEventListener('click', () => {
    const assignmentId = state.modal.data.assignment.id;
    openAssignmentForm('edit', assignmentId);
  });
  const endBtn = document.querySelector('[data-foreman-end]');
  if(endBtn) endBtn.addEventListener('click', async () => {
    const { oldEmp, assignment } = state.modal.data;
    const updated = { ...assignment, endDate: endOfYesterdayISO() };
    try{
      await saveRecord('assignment', updated);
      showToast(`${oldEmp?.name||'Assignment'} ended`);
    }catch(err){ /* saveRecord already surfaced an error toast */ }
    state.modal = null;
    render();
  });
  const transferBtn = document.querySelector('[data-foreman-transfer]');
  if(transferBtn) transferBtn.addEventListener('click', () => {
    const { oldEmp, site } = state.modal.data;
    state.modal = {type:'transfer', data:{site, employeeId: oldEmp?.id||'', destJobSiteId:'', startDate: todayISO(), roleOnSite:'', shift:'Day', workArea:'', notes:''}};
    render();
  });
  const inactiveBtn = document.querySelector('[data-foreman-inactive]');
  if(inactiveBtn) inactiveBtn.addEventListener('click', async () => {
    const { oldEmp, assignment } = state.modal.data;
    const updatedAssignment = { ...assignment, endDate: endOfYesterdayISO() };
    try{
      await saveRecord('assignment', updatedAssignment);
      showToast(`${oldEmp?.name||'Employee'}'s assignment ended`);
    }catch(err){ /* saveRecord already surfaced an error toast */ }
    state.modal = { type:'inactiveTypePrompt', data:{ emp: oldEmp } };
    render();
  });
  const inactivePermanentBtn = document.querySelector('[data-inactive-permanent]');
  if(inactivePermanentBtn) inactivePermanentBtn.addEventListener('click', async () => {
    const { emp, reportId } = state.modal.data;
    try{
      await saveRecord('employee', { ...emp, status:'Inactive', inactiveType:'Permanent', expectedReturnDate:'' });
      if(reportId) await markReportReviewed(reportId);
      showToast(`${emp?.name||'Employee'} marked inactive (Permanent)`);
    }catch(err){ /* saveRecord already surfaced an error toast */ }
    state.modal = null;
    render();
  });
  const inactiveTemporaryBtn = document.querySelector('[data-inactive-temporary]');
  if(inactiveTemporaryBtn) inactiveTemporaryBtn.addEventListener('click', async () => {
    const { emp, reportId } = state.modal.data;
    const dateInput = document.getElementById('inactive-return-date');
    const returnDate = dateInput ? dateInput.value : '';
    try{
      await saveRecord('employee', { ...emp, status:'Inactive', inactiveType:'Temporary', expectedReturnDate: returnDate });
      if(reportId) await markReportReviewed(reportId);
      showToast(`${emp?.name||'Employee'} marked inactive (Temporary)`);
    }catch(err){ /* saveRecord already surfaced an error toast */ }
    state.modal = null;
    render();
  });
  const inactiveDismissBtn = document.querySelector('[data-inactive-dismiss]');
  if(inactiveDismissBtn) inactiveDismissBtn.addEventListener('click', async () => {
    const { reportId, emp } = state.modal.data;
    try{
      if(reportId) await markReportReviewed(reportId);
      showToast(`Report dismissed${emp?.name?` for ${emp.name}`:''}`);
    }catch(err){ /* saveRecord already surfaced an error toast */ }
    state.modal = null;
    render();
  });
  const extendConfirmBtn = document.querySelector('[data-extend-confirm]');
  if(extendConfirmBtn) extendConfirmBtn.addEventListener('click', async () => {
    const { emp } = state.modal.data;
    const dateInput = document.getElementById('extend-return-date');
    const newDate = dateInput ? dateInput.value : '';
    try{
      await saveRecord('employee', { ...emp, status:'Inactive', inactiveType:'Temporary', expectedReturnDate: newDate });
      showToast(`${emp?.name||'Employee'}'s return date updated`);
    }catch(err){ /* saveRecord already surfaced an error toast */ }
    state.modal = null;
    render();
  });
  const keepBothBtn = document.querySelector('[data-foreman-keep-both]');
  if(keepBothBtn) keepBothBtn.addEventListener('click', () => {
    const { site, trade, prevForemanId } = state.modal.data;
    state.modal = null;
    checkOutgoingForemanPrompt(site, trade, prevForemanId);
  });
  const transferHereBtn = document.querySelector('[data-foreman-transfer-here]');
  if(transferHereBtn) transferHereBtn.addEventListener('click', async () => {
    const { emp, site, trade, prevForemanId, otherAssignments } = state.modal.data;
    try{
      for(const a of otherAssignments){
        await saveRecord('assignment', { ...a, endDate: endOfYesterdayISO() });
      }
      showToast(`${emp?.name||'Employee'} transferred here`);
    }catch(err){ /* saveRecord already surfaced an error toast */ }
    state.modal = null;
    checkOutgoingForemanPrompt(site, trade, prevForemanId);
  });
  const clearForemanYesBtn = document.querySelector('[data-foreman-clear-yes]');
  if(clearForemanYesBtn) clearForemanYesBtn.addEventListener('click', async () => {
    const { site, emp } = state.modal.data;
    try{
      await clearForemanSlot(site.id, emp.trade);
      showToast(`${emp.name} removed as ${emp.trade} foreman`);
    }catch(err){ /* saveRecord already surfaced an error toast */ }
    state.modal = null;
    render();
  });
  const clearForemanNoBtn = document.querySelector('[data-foreman-clear-no]');
  if(clearForemanNoBtn) clearForemanNoBtn.addEventListener('click', () => { state.modal = null; render(); });

  const phoneInput = document.getElementById('emp-phone');
  if(phoneInput) phoneInput.addEventListener('blur', () => { phoneInput.value = formatPhone(phoneInput.value); });

  const classSelect = document.getElementById('emp-classification');
  if(classSelect) classSelect.addEventListener('change', () => {
    const yearWrap = document.getElementById('apprentice-year-wrap');
    if(yearWrap) yearWrap.style.display = classSelect.value === 'Apprentice' ? '' : 'none';
    const skillWrap = document.getElementById('skill-wrap');
    if(skillWrap) skillWrap.style.display = (classSelect.value === 'Laborer' || classSelect.value === 'Operator') ? '' : 'none';
  });
  const statusSelect = document.getElementById('emp-status');
  if(statusSelect) statusSelect.addEventListener('change', () => {
    const inactiveWrap = document.getElementById('inactive-type-wrap');
    if(inactiveWrap) inactiveWrap.style.display = statusSelect.value === 'Inactive' ? '' : 'none';
  });
  const inactivePermanentRadio = document.getElementById('inactive-type-permanent');
  const inactiveTemporaryRadio = document.getElementById('inactive-type-temporary');
  [inactivePermanentRadio, inactiveTemporaryRadio].forEach(r => {
    if(r) r.addEventListener('change', () => {
      const returnWrap = document.getElementById('expected-return-wrap');
      if(returnWrap) returnWrap.style.display = (inactiveTemporaryRadio && inactiveTemporaryRadio.checked) ? '' : 'none';
    });
  });

  const ef = document.getElementById('employee-form');
  if(ef) ef.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(ef).entries());
    submitEmployeeForm(f);
  });
  const jf = document.getElementById('jobsite-form');
  if(jf) jf.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(jf).entries());
    submitJobSiteForm(f);
  });
  const af = document.getElementById('assignment-form');
  if(af) af.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(af).entries());
    submitAssignmentForm(f);
  });
  const aff = document.getElementById('assign-foreman-form');
  if(aff) aff.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(aff).entries());
    submitAssignForeman(f);
  });
  const tf = document.getElementById('transfer-form');
  if(tf) tf.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(tf).entries());
    submitTransfer(f);
  });
}

/* ============================= CONFIRM DIALOG ============================= */
function renderConfirm(){
  const c = state.confirm;
  return `
  <div class="confirm-backdrop" data-confirm-backdrop>
    <div class="confirm-box">
      <h3>${escapeHtml(c.title)}</h3>
      <p>${escapeHtml(c.body)}</p>
      <div class="modal-actions" style="margin-top:0">
        <button class="btn btn-secondary btn-block" data-confirm-cancel>Cancel</button>
        <button class="btn btn-danger btn-block" data-confirm-ok>${escapeHtml(c.confirmLabel||'Delete')}</button>
      </div>
    </div>
  </div>`;
}
function bindConfirmEvents(){
  document.querySelector('[data-confirm-cancel]').addEventListener('click', () => { state.confirm=null; render(); });
  document.querySelector('[data-confirm-ok]').addEventListener('click', () => { const fn = state.confirm.onConfirm; fn && fn(); });
  document.querySelector('[data-confirm-backdrop]').addEventListener('click', (e) => {
    if(e.target.dataset.confirmBackdrop !== undefined && e.target === e.currentTarget){ state.confirm=null; render(); }
  });
}

/* ============================= INIT ============================= */
(async function init(){
  if(!msalLoadError && msalInstance){
    try{
      await msalInstance.initialize();
      await msalInstance.handleRedirectPromise();
      const accounts = msalInstance.getAllAccounts();
      if(accounts.length > 0){
        state.account = accounts[0];
        msalInstance.setActiveAccount(accounts[0]);
      }
    }catch(e){
      console.error('MSAL init failed', e);
    }
  }
  render();
  if(state.account) await afterSignIn();
})();
</script>
</body>
</html>
